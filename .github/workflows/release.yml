name: Release

on:
  workflow_dispatch:
    inputs:
      publish_current:
        description: Publish the package versions currently committed on main
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - id: release
        uses: googleapis/release-please-action@v5 # 45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v6.0.2 # de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_current }}
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.5 # 8912a9102ac27614460f54aedde9e1e7f9aec20d
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_current }}

      - uses: actions/setup-node@v6.4.0 # 48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_current }}
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_current }}

      - run: pnpm release:check
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_current }}

      - run: pnpm release:publish
        if: ${{ steps.release.outputs.releases_created == 'true' || inputs.publish_current }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
